# Despliegue en Render: https://render.com
# New + Blueprint apuntando a este archivo, o crear un Web Service desde el repo
# (Render detecta el Dockerfile solo).

services:
  - type: web
    name: supab
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: WEB_ENABLED
        value: "true"
      - key: TZ
        value: America/Havana
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        value: "kR9mX2pL8qW4nT7vB3jF6hY1sD5gA0cZ"

    # Disco persistente para conservar SQLite y las sesiones de WhatsApp entre
    # despliegues (requiere plan pago; en free el sistema de archivos es efímero):
    # disk:
    #   name: supab-data
    #   mountPath: /app/data
    #   sizeGB: 1
